# Spec §2: Player contribution weights.

# Paper Table 2 (Brave et al. 2019), already normalized to sum to 1.
# Defensive position weights by WAR source.
defensive_weights:
  fwar: {C: 0.214, "1B": 0.036, "2B": 0.143, "3B": 0.143, SS: 0.179, LF: 0.071, CF: 0.143, RF: 0.071, DH: 0.0}
  bwar: {C: 0.200, "1B": 0.046, "2B": 0.150, "3B": 0.142, SS: 0.183, LF: 0.067, CF: 0.146, RF: 0.067, DH: 0.0}

# Tango et al. (2007) lineup weights, paper Table 2, slots 1..9, already normalized to sum to 1.
batting_order: [0.212, 0.187, 0.162, 0.136, 0.111, 0.086, 0.061, 0.035, 0.010]

# Weight source: paper Table 2 (derived from Tango & Retrosheet) vs. alt derived from position_adj_runs.
weight_source: table2  # table2 | derived

# Spec §2: Pitcher fielding weight d_it.
# Pitchers get d_it = pitcher_d (default 1.0; paper assumes 1).
pitcher_d: 1.0

# Spec §2: Fielding position adjustment (FanGraphs runs per 162 games).
# Used only if weight_source: derived.
# (adj_j − adj_DH) normalized. Default values from FanGraphs.
# Positions: C, SS, 2B, 3B, CF, LF, RF, 1B, DH (8 fielding positions for l_it).
position_adj_runs:
  C: 12.5
  SS: 7.5
  "2B": 2.5
  "3B": 2.5
  CF: 2.5
  LF: -7.5
  RF: -7.5
  "1B": -12.5
  DH: -17.5

# Spec §2: Optional Baseball-Reference fielding adjustment values.
# null: use FanGraphs defaults above (position_adj_runs).
# else: dict with same keys, overrides position_adj_runs.
position_adj_runs_bref: null
